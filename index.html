<script>
(function(){
  var rc=document.querySelector('select#roleCurve')||document.querySelector('select[name="roleCurve"]')||document.querySelector('select[aria-label="Role Curve"]');
  ['N1','N2','N3','N4','N5'].forEach(function(v){
    if(!rc)return;
    var has=[].some.call(rc.options,function(o){return (o.value||o.textContent).trim().toUpperCase()===v});
    if(!has){var opt=document.createElement('option');opt.value=v;opt.textContent=v;rc.appendChild(opt)}
  });
  window.state=window.state||{};window.state.roleCurve=window.state.roleCurve||'none';
  function U(x){return String(x||'').trim().toUpperCase()}
  function filterByRole(rows,role){if(!role||role==='none')return rows;return rows.filter(function(r){return U(r['Position Level'])===U(role)})}
  var origGet=window.getFilteredRowsAll||null;
  window.getFilteredRowsAll=function(){
    var base=origGet?origGet():(window.applyExistingFilters?window.applyExistingFilters(window.fullDataRows||[]):(window.fullDataRows||[]));
    return filterByRole(base,window.state.roleCurve)
  };
  if(rc){rc.addEventListener('change',function(){window.state.roleCurve=this.value;window.updateAll&&window.updateAll()})}
})();
(function(){
  var s=document.getElementById('departments-search');if(!s)return;
  var orig=window.applyExistingFilters||null;
  function U(x){return String(x||'').trim().toUpperCase()}
  window.applyExistingFilters=function(rows){
    var r=orig?orig(rows):rows;
    var q=U(s.value||'');
    if(/^N[1-5]$/.test(q))r=r.filter(function(x){return U(x['Position Level'])===q});else if(q)r=r.filter(function(x){return String(x.Department||'').toUpperCase().includes(q)});
    return r
  };
  s.addEventListener('input',function(){window.updateAll&&window.updateAll()})
})();
(function(){
  var sel=document.getElementById('currency-select')||document.querySelector('select[aria-label="Currency"]');
  if(sel){
    var has=[].some.call(sel.options,function(o){return o.value==='OMR'});
    if(!has){var o=document.createElement('option');o.value='OMR';o.textContent='OMR';sel.appendChild(o)}
  }
  window.currencySymbols=Object.assign({},window.currencySymbols||{},{OMR:'ر.ع.'});
  window.currencyRates=Object.assign({},window.currencyRates||{},{OMR:1});
})();
(function(){
  function maxOf(a){return a.reduce(function(m,v){return v>m?v:m},0)}
  function smooth(a){var k=[0.06136,0.24477,0.38774,0.24477,0.06136],o=[];for(var i=0;i<a.length;i++){var s=0;for(var j=-2;j<=2;j++){var idx=Math.max(0,Math.min(a.length-1,i+j));s+=a[idx]*k[j+2]}o.push(s)}return o}
  function scaleTo(t,s,f){var T=maxOf(t),S=maxOf(s)||1,M=(T*f)/S;return s.map(function(v){return v*M})}
  function patch(ch){
    if(!ch||!ch.config)return;
    (ch.config.data.datasets||[]).forEach(function(ds){var name=String(ds.label||'').toLowerCase();if(name.indexOf('target')>-1){ds.datalabels=Object.assign({},ds.datalabels||{},{display:false})}});
    ch.options.plugins=ch.options.plugins||{};
    ch.options.plugins.datalabels=Object.assign(ch.options.plugins.datalabels||{},{
      display:function(ctx){return String(ctx.dataset.label||'').toLowerCase().indexOf('target')===-1},
      clamp:true,clip:true,align:'top',anchor:'end',offset:4
    });
    ch.options.scales=ch.options.scales||{};
    ch.options.scales.y=Object.assign(ch.options.scales.y||{},{beginAtZero:true,grace:'10%'});
    var bar=(ch.config.data.datasets||[]).find(function(d){return /bar/i.test(String(d.type||'bar'))});
    var line=(ch.config.data.datasets||[]).find(function(d){return /line/i.test(String(d.type||''))||(!d.type&&/trend/i.test(String(d.label||'')))});
    if(line){
      line.cubicInterpolationMode='monotone';line.tension=0.2;line.yAxisID='y';
      var series=Array.isArray(bar&&bar.data)?bar.data.map(Number):[];
      if(series.length){
        var tr=scaleTo(series,smooth(series),0.90);
        var yMax=(ch.options.scales.y&&ch.options.scales.y.max)||Math.ceil(maxOf(series)*1.15)||100;
        line.data=tr.map(function(v){return Math.min(v,yMax*0.98)})
      }
    }
  }
  function run(){
    var cvs=[].slice.call(document.querySelectorAll('canvas'));
    cvs.forEach(function(cv){
      var ch=(window.Chart&&Chart.getChart)?Chart.getChart(cv):(cv&&cv._chart);
      if(ch)patch(ch)
    })
  }
  var mo=new MutationObserver(function(){setTimeout(run,0)});
  mo.observe(document.documentElement,{subtree:true,childList:true});
  setTimeout(run,200);
})();
</script>
